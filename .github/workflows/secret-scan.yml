name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete reachable history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "$install_dir" gitleaks
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Verify detector rejects a fake private key
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks-self-test.XXXXXX")"
          trap 'rm -rf "$test_dir"' EXIT
          mkdir "$test_dir/safe" "$test_dir/unsafe"
          printf '%s\n' 'G2 safe example without credentials.' > "$test_dir/safe/example.txt"
          {
            printf '%s%s%s\n' '-----BEGIN ' 'PRIVATE KEY' '-----'
            printf '%s\n' 'G2_TEST_ONLY_NOT_A_REAL_KEYG2_TEST_ONLY_NOT_A_REAL_KEYG2_TEST_ONLY_NOT_A_REAL_KEYG2_TEST_ONLY_NOT_A_REAL_KEY'
            printf '%s%s%s\n' '-----END ' 'PRIVATE KEY' '-----'
          } > "$test_dir/unsafe/example.txt"
          : > "$test_dir/empty-ignore"
          gitleaks dir --config=.gitleaks.toml --redact=100 --no-banner --log-level=error \
            --ignore-gitleaks-allow --gitleaks-ignore-path="$test_dir/empty-ignore" \
            --exit-code=42 "$test_dir/safe"
          if gitleaks dir --config=.gitleaks.toml --redact=100 --no-banner --log-level=error \
            --ignore-gitleaks-allow --gitleaks-ignore-path="$test_dir/empty-ignore" \
            --exit-code=42 "$test_dir/unsafe"; then
            echo '::error::Detector accepted the fake private key.'
            exit 1
          else
            result=$?
            if [ "$result" -ne 42 ]; then
              echo '::error::Detector failed with an unexpected error.'
              exit "$result"
            fi
          fi
          echo 'Safe example accepted; fake private key rejected.'

      - name: Scan complete reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/gitleaks-empty-ignore"
          gitleaks git --config=.gitleaks.toml --log-opts="--all --full-history" \
            --redact=100 --no-banner --log-level=warn --ignore-gitleaks-allow \
            --gitleaks-ignore-path="${RUNNER_TEMP}/gitleaks-empty-ignore" \
            --max-archive-depth=2 --max-decode-depth=5 .
